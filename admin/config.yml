backend:
  name: turbo-github
  turbo_site_id: YOUR_TURBO_SITE_ID
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"

    media_folder: ""
    public_folder: ""

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: true

      - label: "Body"
        name: "body"
        widget: "markdown"
