backend:
  name: turbo-github
  turbo_site_id: 18afb2b2-711b-4ae7-9277-b5e8de81f770
  branch: main

media_folder: "articles"
public_folder: ""

collections:
  - name: "articles"
    label: "Articles"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    path: "{{slug}}/index"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Publish Date"
        name: "date"
        widget: "datetime"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: true

      - label: "Body"
        name: "body"
        widget: "markdown"
