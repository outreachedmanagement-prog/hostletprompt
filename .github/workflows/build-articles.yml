name: Build CMS Articles

on:
  push:
    branches:
      - main
    paths:
      - "articles/**"
      - ".github/workflows/build-articles.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cms-articles
  cancel-in-progress: false

jobs:
  build-articles:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip article build]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Markdown tools
        run: npm install --no-save marked gray-matter

      - name: Build articles, homepage latest block and sitemap
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { marked } = require("marked");
          const matter = require("gray-matter");

          const SITE = "https://hostletprompt.online";
          const ROOT = "articles";
          const HOME_LATEST = 6;
          const RELATED = 3;

          const esc = v => String(v ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");

          const slugify = v => String(v)
            .toLowerCase()
            .trim()
            .replace(/[^a-z0-9-]/g, "-")
            .replace(/-+/g, "-")
            .replace(/^-|-$/g, "");

          const STOP = new Set([
            "practical", "guide", "with", "examples", "free", "your", "that", "this",
            "from", "what", "build", "each", "section", "results", "using", "best",
            "how", "and", "the", "for", "prompts", "prompt"
          ]);

          const keywordSet = s => new Set(
            String(s).toLowerCase().split(/[^a-z0-9]+/)
              .filter(w => w.length > 2 && !STOP.has(w))
          );

          const parseDate = v => {
            if (!v) return null;
            const d = v instanceof Date ? v : new Date(String(v));
            return isNaN(d.getTime()) ? null : d;
          };

          const fmtDate = d => d.toLocaleDateString("en-US", {
            year: "numeric", month: "long", day: "numeric", timeZone: "Asia/Karachi"
          });

          const isoDay = d => d.toISOString().slice(0, 10);

          const makeDescription = (explicit, body) => {
            let text = String(explicit || "").trim();
            if (!text) {
              text = String(body || "")
                .replace(/^#{1,6}\s.*$/gm, " ")
                .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
                .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
                .replace(/[#*_`>|]/g, " ");
            }
            text = text.replace(/\s+/g, " ").trim();
            if (text.length <= 160) return text;
            const cut = text.slice(0, 157);
            const i = cut.lastIndexOf(" ");
            return (i > 100 ? cut.slice(0, i) : cut) + "...";
          };

          // Image path: full URL stays as is, "/..." stays as is,
          // plain file name is taken from the article's own folder.
          const imagePath = (img, slug) => {
            img = String(img || "").trim();
            if (!img) return "";
            if (/^https?:\/\//i.test(img)) return img;
            if (img.startsWith("/")) return img;
            return `/articles/${slug}/${img.replace(/^\.\//, "")}`;
          };

          const absUrl = p => /^https?:\/\//i.test(p) ? p : SITE + encodeURI(p);

          const link = slug => `/articles/${encodeURIComponent(slug)}/`;

          if (!fs.existsSync(ROOT)) {
            console.log("No articles folder found. Nothing to build.");
            process.exit(0);
          }

          // ---------- 1. Collect articles ----------
          const articles = [];
          const seen = new Set();

          for (const entry of fs.readdirSync(ROOT, { withFileTypes: true })) {
            let mdFile = null;
            let slug = null;

            if (entry.isFile() && /\.md$/i.test(entry.name)) {
              mdFile = path.join(ROOT, entry.name);
              slug = slugify(entry.name.replace(/\.md$/i, ""));
            } else if (entry.isDirectory()) {
              const candidate = path.join(ROOT, entry.name, "index.md");
              if (fs.existsSync(candidate)) {
                mdFile = candidate;
                slug = slugify(entry.name);
              }
            }

            if (!mdFile || !slug || seen.has(slug)) continue;

            const parsed = matter(fs.readFileSync(mdFile, "utf8"));
            if (parsed.data.draft === true) {
              console.log(`Skipped draft: ${slug}`);
              continue;
            }
            seen.add(slug);

            const title = String(parsed.data.title || slug).trim();
            const imgP = imagePath(parsed.data.image, slug);
            const tags = []
              .concat(parsed.data.tags || [], parsed.data.category || [])
              .map(t => String(t).toLowerCase().trim())
              .filter(Boolean);

            articles.push({
              title,
              slug,
              outputDir: path.join(ROOT, slug),
              image: imgP,
              imageAbs: imgP ? absUrl(imgP) : "",
              desc: makeDescription(parsed.data.description, parsed.content),
              url: `${SITE}/articles/${slug}/`,
              date: parseDate(parsed.data.date),
              tags,
              keywords: keywordSet(title),
              html: marked.parse(parsed.content)
            });
          }

          // Newest first. Articles without a date go last.
          articles.sort((a, b) => {
            const ta = a.date ? a.date.getTime() : -Infinity;
            const tb = b.date ? b.date.getTime() : -Infinity;
            if (ta !== tb) return tb - ta;
            return a.title.localeCompare(b.title);
          });

          // ---------- 2. Related articles ----------
          const relatedFor = a => articles
            .filter(b => b.slug !== a.slug)
            .map(b => {
              let score = 0;
              for (const t of b.tags) if (a.tags.includes(t)) score += 3;
              for (const w of b.keywords) if (a.keywords.has(w)) score += 1;
              return { b, score };
            })
            // sort is stable, so ties stay "newest first"
            .sort((x, y) => y.score - x.score)
            .slice(0, RELATED)
            .map(x => x.b);

          // ---------- 3. Article pages ----------
          for (const a of articles) {
            const rel = relatedFor(a);

            const imageHtml = a.image
              ? `<img class="article-image" src="${esc(a.image)}" alt="${esc(a.title)}">`
              : "";

            const dateHtml = a.date
              ? `<p class="meta"><time datetime="${isoDay(a.date)}">${esc(fmtDate(a.date))}</time></p>`
              : "";

            const relatedHtml = rel.length
              ? `<section class="related">
          <h2>Related Articles</h2>
          <ul>
          ${rel.map(r => `<li><a href="${link(r.slug)}">${esc(r.title)}</a></li>`).join("\n")}
          </ul>
          </section>`
              : "";

            const ld = {
              "@context": "https://schema.org",
              "@type": "Article",
              headline: a.title,
              description: a.desc,
              mainEntityOfPage: a.url,
              author: { "@type": "Organization", name: "Hostlet Prompt", url: SITE },
              publisher: { "@type": "Organization", name: "Hostlet Prompt", url: SITE }
            };
            if (a.imageAbs) ld.image = [a.imageAbs];
            if (a.date) ld.datePublished = a.date.toISOString();
            const ldJson = JSON.stringify(ld).replace(/</g, "\\u003c");

            const page = `<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">

          <title>${esc(a.title)} | Hostlet Prompt</title>

          <meta name="description" content="${esc(a.desc)}">
          <meta name="robots" content="index,follow">
          <link rel="canonical" href="${esc(a.url)}">

          <meta property="og:type" content="article">
          <meta property="og:site_name" content="Hostlet Prompt">
          <meta property="og:title" content="${esc(a.title)}">
          <meta property="og:description" content="${esc(a.desc)}">
          <meta property="og:url" content="${esc(a.url)}">
          ${a.imageAbs ? `<meta property="og:image" content="${esc(a.imageAbs)}">` : ""}
          ${a.date ? `<meta property="article:published_time" content="${a.date.toISOString()}">` : ""}

          <meta name="twitter:card" content="${a.imageAbs ? "summary_large_image" : "summary"}">
          <meta name="twitter:title" content="${esc(a.title)}">
          <meta name="twitter:description" content="${esc(a.desc)}">
          ${a.imageAbs ? `<meta name="twitter:image" content="${esc(a.imageAbs)}">` : ""}

          <script type="application/ld+json">${ldJson}</script>

          <style>
          * { box-sizing: border-box; }

          body {
            margin: 0;
            background: linear-gradient(to bottom, #100950, #04125D, #030725, #000);
            color: #fff;
            font-family: Arial, sans-serif;
          }

          .wrap { max-width: 900px; margin: auto; padding: 50px 20px; }

          .nav { margin-bottom: 25px; display: flex; gap: 12px; flex-wrap: wrap; }

          .nav a {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
          }

          .nav a:hover { background: #38bdf8; color: #000; }

          .box {
            background: rgba(4,18,93,.85);
            border: 1px solid rgba(56,189,248,.5);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 0 30px rgba(56,189,248,.25);
          }

          h1 {
            font-size: 40px;
            line-height: 1.25;
            margin: 0 0 15px;
            text-shadow: 0 0 18px rgba(56,189,248,.7);
          }

          .meta { color: #9ca3af; margin: 0 0 25px; font-size: 15px; }

          .article-image {
            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 12px;
            margin: 0 0 30px;
          }

          .content { color: #d1d5db; font-size: 17px; line-height: 1.8; }
          .content h2, .content h3 { color: #38bdf8; }
          .content a { color: #38bdf8; }
          .content img { max-width: 100%; height: auto; border-radius: 10px; }
          .content pre { overflow-x: auto; background: rgba(0,0,0,.35); padding: 14px; border-radius: 10px; }
          .content table { border-collapse: collapse; max-width: 100%; display: block; overflow-x: auto; }
          .content th, .content td { border: 1px solid rgba(56,189,248,.4); padding: 8px 12px; }

          .related {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(56,189,248,.35);
          }

          .related h2 { color: #38bdf8; margin: 0 0 12px; }
          .related ul { margin: 0; padding-left: 20px; line-height: 2; }
          .related a { color: #fff; }
          .related a:hover { color: #38bdf8; }

          @media (max-width: 600px) {
            h1 { font-size: 30px; }
            .box { padding: 22px; }
          }
          </style>
          </head>

          <body>

          <div class="wrap">

          <nav class="nav">
            <a href="/">Home</a>
            <a href="/articles/">← All Articles</a>
          </nav>

          <div class="box">

          <h1>${esc(a.title)}</h1>

          ${dateHtml}

          ${imageHtml}

          <div class="content">
          ${a.html}
          </div>

          ${relatedHtml}

          </div>

          </div>

          </body>
          </html>
          `;

            fs.mkdirSync(a.outputDir, { recursive: true });
            fs.writeFileSync(path.join(a.outputDir, "index.html"), page, "utf8");
            console.log(`Built: ${a.outputDir}/index.html (related: ${rel.map(r => r.slug).join(", ") || "none"})`);
          }

          // ---------- 4. Articles listing page ----------
          const cards = articles.length
            ? articles.map(a => `
          <article class="card">
          ${a.image ? `<a href="${link(a.slug)}"><img src="${esc(a.image)}" alt="${esc(a.title)}" loading="lazy"></a>` : ""}
          <div>
          <h2><a href="${link(a.slug)}">${esc(a.title)}</a></h2>
          ${a.date ? `<p class="date">${esc(fmtDate(a.date))}</p>` : ""}
          <p>${esc(a.desc)}</p>
          <a href="${link(a.slug)}">Read Article →</a>
          </div>
          </article>
          `).join("")
            : "<p>No articles have been published yet.</p>";

          const listing = `<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">

          <title>Articles | Hostlet Prompt</title>

          <meta name="description" content="AI prompts, prompt engineering, ChatGPT, Gemini, Cloud AI and web development articles.">
          <meta name="robots" content="index,follow">
          <link rel="canonical" href="${SITE}/articles/">

          <style>
          * { box-sizing: border-box; }

          body {
            margin: 0;
            background: linear-gradient(to bottom, #100950, #04125D, #030725, #000);
            color: #fff;
            font-family: Arial, sans-serif;
          }

          .wrap { max-width: 1100px; margin: auto; padding: 50px 20px; }

          .nav { margin-bottom: 25px; }

          .nav a {
            display: inline-block;
            padding: 10px 18px;
            border: 1px solid #38bdf8;
            border-radius: 8px;
            color: #fff;
            text-decoration: none;
          }

          .nav a:hover { background: #38bdf8; color: #000; }

          .head { text-align: center; margin-bottom: 35px; }
          .head h1 { font-size: 42px; margin: 0 0 10px; text-shadow: 0 0 18px rgba(56,189,248,.7); }
          .head p { color: #d1d5db; line-height: 1.7; }

          .list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; }

          .card {
            overflow: hidden;
            background: rgba(4,18,93,.85);
            border: 1px solid rgba(56,189,248,.5);
            border-radius: 18px;
            box-shadow: 0 0 25px rgba(56,189,248,.18);
          }

          .card img { width: 100%; height: 190px; object-fit: cover; display: block; }
          .card div { padding: 24px; }
          .card h2 { line-height: 1.35; }
          .card a { color: #38bdf8; text-decoration: none; }
          .card p { color: #d1d5db; line-height: 1.7; }
          .card .date { color: #9ca3af; font-size: 14px; margin: 0; }
          </style>
          </head>

          <body>

          <div class="wrap">

          <nav class="nav"><a href="/">← Home</a></nav>

          <header class="head">
          <h1>Hostlet Prompt Articles</h1>
          <p>Explore AI prompts, prompt engineering, ChatGPT, Gemini, Cloud AI and web development articles.</p>
          </header>

          <main class="list">
          ${cards}
          </main>

          </div>

          </body>
          </html>
          `;

          fs.writeFileSync(path.join(ROOT, "index.html"), listing, "utf8");
          console.log(`Built articles index with ${articles.length} article(s).`);

          // ---------- 5. Homepage "Latest Articles" block ----------
          // Works only if index.html contains these two marker comments:
          //   <!-- LATEST-ARTICLES-START -->
          //   <!-- LATEST-ARTICLES-END -->
          const START = "<!-- LATEST-ARTICLES-START -->";
          const END = "<!-- LATEST-ARTICLES-END -->";

          if (fs.existsSync("index.html")) {
            let home = fs.readFileSync("index.html", "utf8");
            const s = home.indexOf(START);
            const e = home.indexOf(END);

            if (s !== -1 && e !== -1 && e > s) {
              const latest = articles.slice(0, HOME_LATEST);
              const block = latest.length
                ? `<section class="latest-articles" style="max-width:1100px;margin:40px auto;padding:0 20px;">
          <h2 style="text-align:center;">Latest Articles</h2>
          <ul style="list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;">
          ${latest.map(a => `<li style="border:1px solid rgba(56,189,248,.5);border-radius:14px;padding:18px;background:rgba(4,18,93,.6);">
          <a href="${link(a.slug)}" style="color:#38bdf8;font-weight:bold;text-decoration:none;">${esc(a.title)}</a>
          <p style="color:#d1d5db;line-height:1.6;margin:8px 0 0;">${esc(a.desc)}</p>
          </li>`).join("\n")}
          </ul>
          <p style="text-align:center;"><a href="/articles/" style="color:#38bdf8;">View all articles →</a></p>
          </section>`
                : "";

              home = home.slice(0, s + START.length) + "\n" + block + "\n" + home.slice(e);
              fs.writeFileSync("index.html", home, "utf8");
              console.log(`Updated homepage with ${latest.length} latest article(s).`);
            } else {
              console.log("Homepage markers not found in index.html. Skipping homepage update.");
            }
          } else {
            console.log("index.html not found. Skipping homepage update.");
          }

          // ---------- 6. Sitemap ----------
          // Keeps every non-article URL as it is, and rebuilds all /articles/ URLs
          // from scratch (so deleted articles disappear, new ones are added).
          const defaultSitemap = `<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          </urlset>
          `;

          let xml = fs.existsSync("sitemap.xml")
            ? fs.readFileSync("sitemap.xml", "utf8")
            : defaultSitemap;

          const siteRe = SITE.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const oldArticleUrls = new RegExp(
            `\\s*<url>\\s*<loc>\\s*${siteRe}/articles/[^<]*</loc>[\\s\\S]*?</url>`,
            "g"
          );
          xml = xml.replace(oldArticleUrls, "");

          const newest = articles.find(a => a.date);
          const entries = [
            { loc: `${SITE}/articles/`, lastmod: newest ? isoDay(newest.date) : null },
            ...articles.map(a => ({ loc: a.url, lastmod: a.date ? isoDay(a.date) : null }))
          ];

          const lines = entries.map(x =>
            `  <url>\n    <loc>${x.loc}</loc>${x.lastmod ? `\n    <lastmod>${x.lastmod}</lastmod>` : ""}\n  </url>`
          );

          xml = xml.replace(/\s*<\/urlset>\s*$/i, () => `\n${lines.join("\n")}\n</urlset>\n`);
          fs.writeFileSync("sitemap.xml", xml, "utf8");
          console.log(`Sitemap rebuilt with ${entries.length} article URL(s).`);
          EOF

      - name: Commit generated pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles/ sitemap.xml index.html

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build CMS articles [skip article build]"
            git pull --rebase origin main
            git push
          fi
