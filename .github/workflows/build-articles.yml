name: Build CMS Articles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-articles:
    if: "!contains(github.event.head_commit.message, '[skip article build]')"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Markdown tools
        run: |
          npm install marked gray-matter

      - name: Build article pages
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");
          const { marked } = require("marked");
          const matter = require("gray-matter");

          const articlesDir = "articles";

          if (!fs.existsSync(articlesDir)) {
            console.log("No articles folder found.");
            process.exit(0);
          }

          const folders = fs.readdirSync(articlesDir, {
            withFileTypes: true
          });

          for (const folder of folders) {

            if (!folder.isDirectory()) continue;

            const articleDir = path.join(
              articlesDir,
              folder.name
            );

            const markdownFile = path.join(
              articleDir,
              "index.md"
            );

            if (!fs.existsSync(markdownFile)) continue;

            const markdown = fs.readFileSync(
              markdownFile,
              "utf8"
            );

            const parsed = matter(markdown);

            const title =
              parsed.data.title || folder.name;

            const image =
              parsed.data.image || "";

            const htmlContent =
              marked.parse(parsed.content);

            let imageHtml = "";

            if (image) {
              imageHtml = `
                <img
                  src="${image}"
                  alt="${title}"
                  class="article-image"
                >
              `;
            }

            const page = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>${title} | Hostlet Prompt</title>

<style>

body {
    margin: 0;
    background:
        linear-gradient(
            to bottom,
            #100950,
            #04125D,
            #030725,
            #000000
        );
    color: #ffffff;
    font-family: Arial, sans-serif;
}

.article-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 50px 20px;
}

.article-box {
    background: rgba(4,18,93,0.85);
    border: 1px solid rgba(56,189,248,0.5);
    border-radius: 18px;
    padding: 35px;
    box-shadow:
        0 0 30px rgba(56,189,248,0.25);
}

h1 {
    color: #ffffff;
    font-size: 40px;
    line-height: 1.25;
    margin-top: 0;
    text-shadow:
        0 0 18px rgba(56,189,248,0.7);
}

.article-image {
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    border-radius: 12px;
    margin: 20px 0 30px;
}

.article-content {
    color: #d1d5db;
    font-size: 17px;
    line-height: 1.8;
}

.article-content h2,
.article-content h3 {
    color: #38bdf8;
}

.article-content a {
    color: #38bdf8;
}

.back-button {
    display: inline-block;
    margin-bottom: 25px;
    padding: 10px 18px;
    border: 1px solid #38bdf8;
    border-radius: 8px;
    color: #ffffff;
    text-decoration: none;
}

.back-button:hover {
    background: #38bdf8;
    color: #000000;
}

</style>
</head>

<body>

<div class="article-wrapper">

<a
href="/write-for-us/"
class="back-button"
>
← Back to Articles
</a>

<div class="article-box">

<h1>${title}</h1>

${imageHtml}

<div class="article-content">
${htmlContent}
</div>

</div>

</div>

</body>
</html>`;

            const outputFile = path.join(
              articleDir,
              "index.html"
            );

            fs.writeFileSync(
              outputFile,
              page
            );

            console.log(
              "Built:",
              outputFile
            );
          }
          EOF

      - name: Commit generated article pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add articles/

          if git diff --cached --quiet; then
            echo "No article pages to commit."
          else
            git commit -m "Build article pages [skip article build]"
            git push
          fi
