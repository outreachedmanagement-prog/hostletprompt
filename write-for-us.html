<script>
/* =========================================================
   HOSTLET PROMPT - DECAP CMS ARTICLES LOADER
   This addition does NOT change the existing design,
   navigation, links, or written content.
========================================================= */

document.addEventListener("DOMContentLoaded", function () {

    const repoOwner = "outreachedmanagement-prog";
    const repoName = "hostletprompt";
    const branch = "main";

    const articlesGrid = document.querySelector(".articles-grid");

    if (!articlesGrid) return;

    /* Get all article folders from GitHub */
    fetch(
        `https://api.github.com/repos/${repoOwner}/${repoName}/git/trees/${branch}?recursive=1`
    )
    .then(response => response.json())
    .then(treeData => {

        if (!treeData.tree) return;

        /* Find all CMS article index.md files */
        const articleFiles = treeData.tree.filter(item =>
            item.type === "blob" &&
            item.path.startsWith("articles/") &&
            item.path.endsWith("/index.md")
        );

        if (articleFiles.length === 0) return;

        articleFiles.forEach(file => {

            const rawUrl =
                `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/${file.path}`;

            fetch(rawUrl)
                .then(response => response.text())
                .then(markdown => {

                    const article = parseArticle(markdown);

                    if (!article.title) return;

                    const articleFolder =
                        file.path.replace("/index.md", "");

                    const articleSlug =
                        articleFolder.replace("articles/", "");

                    createArticleCard(
                        article,
                        articleSlug
                    );

                })
                .catch(error => {
                    console.log("Article could not be loaded:", error);
                });
        });

    })
    .catch(error => {
        console.log("GitHub article loading error:", error);
    });


    /* =========================================================
       READ DECUP CMS FRONT MATTER
    ========================================================= */

    function parseArticle(markdown) {

        const article = {
            title: "",
            date: "",
            image: "",
            body: ""
        };

        /* Front matter */
        const frontMatterMatch =
            markdown.match(/^---\s*([\s\S]*?)\s*---/);

        if (frontMatterMatch) {

            const frontMatter = frontMatterMatch[1];

            const titleMatch =
                frontMatter.match(/title:\s*["']?(.+?)["']?\s*$/m);

            const dateMatch =
                frontMatter.match(/date:\s*["']?(.+?)["']?\s*$/m);

            const imageMatch =
                frontMatter.match(/image:\s*["']?(.+?)["']?\s*$/m);

            if (titleMatch)
                article.title = cleanValue(titleMatch[1]);

            if (dateMatch)
                article.date = cleanValue(dateMatch[1]);

            if (imageMatch)
                article.image = cleanValue(imageMatch[1]);
        }

        /* Article body */
        article.body =
            markdown.replace(/^---\s*[\s\S]*?\s*---/, "").trim();

        return article;
    }


    function cleanValue(value) {

        return value
            .trim()
            .replace(/^["']|["']$/g, "");
    }


    /* =========================================================
       CREATE ARTICLE CARD
    ========================================================= */

    function createArticleCard(article, slug) {

        /* Prevent duplicate cards */
        if (
            articlesGrid.querySelector(
                `[data-cms-article="${slug}"]`
            )
        ) {
            return;
        }

        const card = document.createElement("div");

        card.className = "article-card shared-bg";

        card.setAttribute(
            "data-cms-article",
            slug
        );

        /* Image */
        const image = document.createElement("img");

        image.className = "article-thumb";

        image.alt = article.title;

        let imageUrl = article.image;

        /*
           Decap may save the image path in different formats.
           Convert repository paths into usable URLs.
        */

        if (imageUrl) {

            imageUrl = imageUrl.trim();

            if (imageUrl.startsWith("/images/")) {

                imageUrl =
                    `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}${imageUrl}`;

            } else if (imageUrl.startsWith("images/")) {

                imageUrl =
                    `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/${imageUrl}`;

            } else if (
                !imageUrl.startsWith("http://") &&
                !imageUrl.startsWith("https://")
            ) {

                imageUrl =
                    `https://raw.githubusercontent.com/${repoOwner}/${repoName}/${branch}/${imageUrl}`;
            }
        }

        if (imageUrl) {
            image.src = imageUrl;
        }

        /* Content */
        const content = document.createElement("div");

        content.className = "article-content";

        /* Title */
        const title = document.createElement("h3");

        title.textContent = article.title;

        /* Description */
        const description = document.createElement("p");

        const plainText =
            article.body
                .replace(/[#*_>`~-]/g, "")
                .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
                .replace(/\n+/g, " ")
                .trim();

        description.textContent =
            plainText.length > 160
                ? plainText.substring(0, 160) + "..."
                : plainText;

        /* Read button */
        const readButton =
            document.createElement("a");

        readButton.href =
            `?article=${encodeURIComponent(slug)}`;

        readButton.className = "read-btn";

        readButton.textContent =
            "Read Article";

        content.appendChild(title);
        content.appendChild(description);
        content.appendChild(readButton);

        card.appendChild(image);
        card.appendChild(content);

        articlesGrid.appendChild(card);
    }

});
</script>
