<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: linear-gradient(
        to bottom,
        #100950,
        #04125D,
        #030725,
        #000
    );
    color: #fff;
    font-family: Arial, sans-serif;
}

.wrap {
    max-width: 1100px;
    margin: auto;
    padding: 50px 20px;
}

.head {
    text-align: center;
    margin-bottom: 35px;
}

.head h1 {
    font-size: 42px;

}

.head p {
    color: #d1d5db;
    line-height: 1.7;
}

.list {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px, 1fr)
        );
    gap: 24px;
}

.card {
    overflow: hidden;
    background: rgba(4,18,93,.85);
    border: 1px solid rgba(56,189,248,.5);
    border-radius: 18px;
    box-shadow:
        0 0 25px rgba(56,189,248,.18);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.card div {
    padding: 24px;
}

.card h2 {
    line-height: 1.35;
}

.card a {
    color: #38bdf8;
    text-decoration: none;
}

.card p {
    color: #d1d5db;
    line-height: 1.7;
}

</style>
